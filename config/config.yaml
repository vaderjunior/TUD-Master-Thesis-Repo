# Default prototype settings. Frozen studies record their own overrides.
api:
  temperature: 1.0
  timeout_seconds: 180
  max_tokens: 4096
  tudagpt:
    url_env: TUDAGPT_URL
    token_env: TUDAGPT_TOKEN
    default_model: qwen3.5-122b-a10b
    models_strong:
    - qwen3.5-397b-a17b
    - glm-4.7
    - mistral-large-3-675b-instruct-2512
    models_medium:
    - qwen3.5-122b-a10b
    - openai-gpt-oss-120b
    models_fast:
    - qwen3-30b-a3b-instruct-2507
    - meta-llama-3.1-8b-instruct
  peasec:
    url_env: PEASEC_URL
    token_env: PEASEC_TOKEN
    default_model: Qwen/Qwen3-VL-32B-Instruct
    models_strong:
    - Qwen/Qwen3-VL-32B-Instruct
    models_medium:
    - Qwen/Qwen3-VL-32B-Instruct
    models_fast:
    - Qwen/Qwen3-VL-8B-Instruct
classify:
  provider: peasec
  pinned_model: Qwen/Qwen3-VL-32B-Instruct
  max_repair_retries: 2
  n_votes_dev: 3
  fewshot_seed: 42
paths:
  data_raw: data/raw
  data_processed: data/processed
  kb_records: kb/records.jsonl
  results: experiments/results
kb:
  records_path: kb/records.jsonl
  chroma_path: kb/chroma
  embedding_model: BAAI/bge-m3
  examples_per_label: 10
retrieval:
  strategy: hybrid
  k_definitions: 2
  k_definitions_mode: flat
  k_definitions_per_dimension: 1
  k_definitions_per_label: 0.3
  k_guidelines: 2
  k_examples: 5
  k_examples_feedback: 0
  use_mmr: true
  mmr_lambda: 0.7
  mmr_pool_factor: 3
  use_reranker: false
  rrf_k: 60
reporting:
  # Older label-exclusion diagnostic; main scores use observed label support.
  macro_exclude:
  - other
