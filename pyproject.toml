[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hate-speech-rag"
version = "0.1.0"
description = "English and German hate speech classification with editable retrieved knowledge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "python-dotenv>=1,<2",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
data = ["numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=17", "scikit-learn>=1.5,<2", "ftfy>=6,<7", "datasets==2.21.0"]
retrieval = ["chromadb>=1.5,<2", "sentence-transformers>=5,<6", "rank-bm25==0.2.2"]
analysis = ["rank-bm25==0.2.2", "numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=17", "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "matplotlib>=3.8,<4", "jsonschema>=4,<5", "jinja2>=3.1,<4", "tokenizers>=0.20", "threadpoolctl>=3,<4"]
test = ["rank-bm25==0.2.2", "tokenizers>=0.20", "jinja2>=3.1,<4", "pytest>=8,<10", "numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=17", "scikit-learn>=1.5,<2", "ftfy>=6,<7"]

training = ["numpy>=2,<3", "pandas>=2.2,<4", "pyarrow>=17", "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "torch>=2.6,<3", "transformers>=5.12,<6", "accelerate>=1,<2", "safetensors>=0.8,<1", "psutil>=7,<8"]

[project.scripts]
hsrag = "src.hsrag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src.hsrag*", "scripts*", "analysis*", "training*"]
namespaces = true
